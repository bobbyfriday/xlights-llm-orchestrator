[project]
name = "xlights-mcp"
version = "0.1.0"
description = "MCP server exposing the xLights automation API (reads + sequence editing) as tools."
requires-python = ">=3.11"
dependencies = [
    "xlights-core",
    # Upper-bounded on purpose: server.py is written against the v1 API
    # (`mcp.server.fastmcp.FastMCP`/`Context`). mcp 2.x renamed FastMCP to
    # MCPServer (`mcp.server.mcpserver`) and changed surrounding APIs, so an
    # unbounded range breaks the import outright — and the repo resolves fresh
    # in CI (no tracked lockfile), so it breaks on an upstream release alone.
    # Lift this together with the 15-tool migration, not before it.
    "mcp[cli]>=1.2,<2",
    "anyio>=4",
]

# Audio tools work only when the audio stack is installed; opt in with xlights-mcp[audio].
[project.optional-dependencies]
audio = ["xlights-core[audio]"]

[project.scripts]
xlights-mcp = "xlights_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlights_mcp"]

[tool.uv.sources]
xlights-core = { workspace = true }
