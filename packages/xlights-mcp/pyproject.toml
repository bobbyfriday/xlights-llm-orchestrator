[project]
name = "xlights-mcp"
version = "0.1.0"
description = "MCP server exposing the xLights automation API (reads + sequence editing) as tools."
requires-python = ">=3.11"
dependencies = [
    "xlights-core",
    # server.py is written against the v2 API (`mcp.server.mcpserver.MCPServer`).
    # Kept upper-bounded: the repo tracks no lockfile and resolves fresh in CI,
    # so an unbounded range lets a major release break the build with no commit
    # (exactly how 1.x→2.x landed). Raise the ceiling with a migration, not before.
    "mcp[cli]>=2,<3",
    "anyio>=4",
]

# Audio tools work only when the audio stack is installed; opt in with xlights-mcp[audio].
[project.optional-dependencies]
audio = ["xlights-core[audio]"]

[project.scripts]
xlights-mcp = "xlights_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlights_mcp"]

[tool.uv.sources]
xlights-core = { workspace = true }
